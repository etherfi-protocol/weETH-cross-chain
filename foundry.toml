[profile.default]
src = "contracts"
evm_version = "shanghai"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
fs_permissions = [
    { access = "read-write", path = "./" },
    # read-only access to sibling repos so tests can replay the exact 3CP proposal JSONs
    # (PROPOSAL_DIR points at 3CP-secure/queued/<N>); only used when that env var is set.
    { access = "read", path = "../.." },
]

optimizer = true
optimizer_runs = 200
solc_version = "0.8.22"

# remove the hash of the metadata for more deterministic code 
bytecode_hash = 'none'

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# zkSync Era source-verification profile: zksolc cannot compile some test/script files
# (e.g. test/L1SyncPoolUpgrade.t.sol uses EXTCODECOPY, unsupported on EraVM). verify-contract has
# no --skip flag, so the skip must live in config. EtherFiTimelock itself compiles cleanly.
#   FOUNDRY_PROFILE=zkverify forge verify-contract … --zksync --verifier zksync …
[profile.zkverify]
src = "contracts"
test = "contracts"
script = "contracts"
skip = ["test/**", "script/**", "*.t.sol", "*.s.sol"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.22"
bytecode_hash = 'none'

[etherscan]
base = { key = "${MAINNET_ETHERSCAN_KEY}" }
linea = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 59144 }
scroll = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 534352 }
unichain = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 130 }
berachain = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 80094 }
op = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 10 }
bnb = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 56 }
hyperevm  = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 999 }
sonic  = { key = "${MAINNET_ETHERSCAN_KEY}", chain = 146 }
